  <rect x="955" y="575" width="225" height="82" rx="9" fill="#fff8ef" stroke="#e7a24f" stroke-width="1.7"/>
  <rect x="972" y="597" width="36" height="36" rx="8" fill="#d77b19"/>
  <text x="990" y="621" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">L</text>
  <text x="1022" y="603" class="node-title">get_deliveries</text>
  <text x="1022" y="627" class="node-sub">Paginated list</text>
  <rect x="1205" y="575" width="235" height="82" rx="9" fill="#fff8ef" stroke="#e7a24f" stroke-width="1.7"/>
  <rect x="1222" y="597" width="36" height="36" rx="8" fill="#d77b19"/>
  <text x="1240" y="621" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">L</text>
  <text x="1272" y="603" class="node-title">update_status</text>
