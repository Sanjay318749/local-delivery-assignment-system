  <rect x="742" y="597" width="36" height="36" rx="8" fill="#d77b19"/>
  <text x="760" y="621" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">L</text>
  <text x="792" y="603" class="node-title">assign_driver</text>
