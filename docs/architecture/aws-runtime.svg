<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Local Delivery Assignment System AWS Architecture</title>
  <desc id="desc">AWS architecture showing the browser, Cognito, API Gateway, Lambda handlers, private S3 assets, DynamoDB tables, and CloudWatch logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667b91"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e28a25"/></marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad5550"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#25364a}.small{font-size:14px;fill:#66768a}.label{font-size:15px;fill:#42556b}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#68788b}.group{fill:#fff;stroke:#9aabba;stroke-width:2}.group-title{font-size:17px;font-weight:700;letter-spacing:.5px}.node{fill:#fff;stroke:#bcc8d3;stroke-width:1.5}.node-title{font-size:17px;font-weight:700}.node-sub{font-size:13px;fill:#69798b}.line{fill:none;stroke:#667b91;stroke-width:3;marker-end:url(#arrow)}.orange-line{fill:none;stroke:#e28a25;stroke-width:3;marker-end:url(#arrow-orange)}.permission{fill:none;stroke:#ad5550;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow-dash)}.pill{fill:#fff;stroke:#dbe2e8;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#edf2f6"/>
  <rect x="34" y="34" width="1532" height="872" rx="18" fill="#fff" stroke="#8e9eac" stroke-width="2"/>
  <rect x="54" y="54" width="38" height="30" rx="5" fill="#ed8b23"/>
  <text x="73" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">AWS</text>
  <text x="108" y="76" font-size="18" font-weight="700">AWS CLOUD</text>
  <text x="1528" y="76" text-anchor="end" class="title">Local Delivery Assignment System</text>
